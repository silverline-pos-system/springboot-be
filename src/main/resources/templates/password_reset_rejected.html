<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Request Update</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
        .header { background: linear-gradient(135deg, #ef4444, #dc2626); padding: 32px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.025em; }
        .content { padding: 40px 32px; line-height: 1.6; }
        .content p { margin: 0 0 16px; color: #475569; font-size: 16px; }
        .reason-box { background-color: #fef2f2; border-left: 4px solid #ef4444; padding: 16px; margin: 24px 0; border-radius: 4px; }
        .reason-box p { margin: 0; color: #991b1b; font-size: 15px; font-style: italic; }
        .footer { background-color: #f1f5f9; padding: 24px 32px; text-align: center; border-top: 1px solid #e2e8f0; }
        .footer p { margin: 0; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Password Reset Request Update</h1>
        </div>
        <div class="content">
            <p>Dear ${fullName},</p>
            <p>Your password reset request has been rejected by the administrator.</p>
            <div class="reason-box">
                <p>Reason: ${reason}</p>
            </div>
            <p>If you believe this is an error, please contact your administrator.</p>
        </div>
        <div class="footer">
            <p>Best Regards,<br>Silverline Admin Team</p>
        </div>
    </div>
</body>
</html>
