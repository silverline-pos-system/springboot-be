spring:
  application:
    name: rocs
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/silverline?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:2007}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:smartretailpro.info@gmail.com}
    password: ${MAIL_PASSWORD:ttpc ulel iqqo ndji}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mySecretKey: ${JWT_SECRET:dGhpc2lzYXZlcnlsb25nc2VjcmV0aos2V5Zm9yand0dG9rZW5nZW5lcmF0aW9uYW5kaXRzaG91bGRiZWF0bGVhc3QyNTZiaXRz}
jwt:
  expiration-ms: ${JWT_EXPIRATION_MS:36000000}

logging:
  level:
    root: INFO
    com.nsbm.rocs: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/rocs-backend.log}
    max-size: 10MB
    max-history: 30

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

rocs:
  admin:
    username: ${ROCS_ADMIN_USERNAME:admin}
    password: ${ROCS_ADMIN_PASSWORD:admin@123}
    email: ${ROCS_ADMIN_EMAIL:shamikakeshanuni@gmail.com}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:60}
    login-attempts-per-minute: ${RATE_LIMIT_LOGIN_RPM:5}
