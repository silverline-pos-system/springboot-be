spring:
  threads:
    virtual:
      enabled: true
  application:
    name: rocs
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/silverline?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    # No default: production must supply DB_PASSWORD via environment. App fails fast if missing.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Flyway owns the schema. validate fails startup on drift instead of silently altering tables.
      # If startup fails after this change, reconcile the schema with a Flyway migration, do NOT revert to update.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    # No defaults: supply real SMTP credentials via environment. The previous committed app password must be revoked.
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# No default: supply a fresh base64 256-bit secret via JWT_SECRET. The previously committed value must not be reused.
mySecretKey: ${JWT_SECRET}
jwt:
  expiration-ms: ${JWT_EXPIRATION_MS:36000000}

logging:
  level:
    root: INFO
    com.silverline.erp: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    # [%X{requestId}] is the per-request correlation id set by RequestIdFilter (traceability).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/rocs-backend.log}
    max-size: 10MB
    max-history: 30

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/css,text/plain
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always

rocs:
  admin:
    username: ${ROCS_ADMIN_USERNAME:admin}
    # No defaults: bootstrap admin credentials must come from environment and be rotated after first login.
    password: ${ROCS_ADMIN_PASSWORD}
    email: ${ROCS_ADMIN_EMAIL}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:60}
    login-attempts-per-minute: ${RATE_LIMIT_LOGIN_RPM:5}
  imei:
    suffix-length: ${ROCS_IMEI_SUFFIX_LENGTH:9}

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # Only health is public (used by load balancers). info/metrics are gated in SecurityConfig to SUPER_ADMIN.
        include: ${ACTUATOR_EXPOSURE:health,info,metrics}
  endpoint:
    health:
      # Do not leak DB pool internals to anonymous callers.
      show-details: when_authorized
