# Test-only configuration (test classpath only, never packaged into the production jar).
# Supplies non-production values for the secrets whose defaults were removed from application.yml,
# so the Spring context can start during tests without exporting real credentials.
#
# OS environment variables still take precedence over these, so a developer running the
# integration tests against a local PostgreSQL can override DB_PASSWORD via the environment.

# Not a real secret: a placeholder so context startup does not fail. Override via env for a live DB.
DB_PASSWORD=changeme

# Deterministic base64 test key (>=256 bits) so JWT signing works in tests. Not used in production.
JWT_SECRET=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLWluLXVuaXQtdGVzdHMtMjU2LWJpdHM

# Placeholder mail + admin values for context startup only.
MAIL_USERNAME=test@example.com
MAIL_PASSWORD=changeme
ROCS_ADMIN_PASSWORD=changeme
ROCS_ADMIN_EMAIL=admin@example.com
